<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Gagan Karthik</title>
<meta name="description" content="This page wandered off." />
<meta name="theme-color" content="#0e0e10" />
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="apple-touch-icon" href="assets/img/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<style>
  body { cursor: auto; }
  .err {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 100px 20px;
    position: relative;
  }
  .err-character {
    width: clamp(180px, 26vw, 280px);
    height: auto;
    margin: 0 auto 20px;
    display: block;
    border-radius: 50%;
    background: var(--bg-2);
    border: 2px dashed var(--accent);
    padding: 14px;
    transform: rotate(-4deg);
    transition: transform 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .err-character:hover { transform: rotate(0deg) scale(1.04); }
  .err-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 10px;
  }
  .err-tag::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent-2);
    animation: pulse 2s ease-in-out infinite;
  }
  .err h1 {
    font-family: var(--serif);
    font-size: clamp(72px, 14vw, 180px);
    line-height: 0.9;
    letter-spacing: -0.04em;
    color: var(--accent);
    font-style: italic;
    font-weight: 300;
    margin-bottom: 14px;
  }
  .err p {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 36px;
  }
  .err a.home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--accent);
    color: var(--accent);
    padding-bottom: 4px;
    transition: letter-spacing 280ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .err a.home:hover { letter-spacing: 0.1em; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,93,77,0.55); }
    50%      { box-shadow: 0 0 0 7px rgba(232,93,77,0); }
  }
</style>
</head>
<body>
<section class="err">
  <div>
    <img class="err-character" src="https://api.dicebear.com/9.x/lorelei/svg?seed=Wanderer" alt="A confused stylised character looking around" loading="lazy" />
    <div class="err-tag">404 · page wandered off</div>
    <h1>Lost.</h1>
    <p>This page took the day off.</p>
    <a class="home" href="index.html">← Back to home</a>
  </div>
</section>
</body>
</html>
